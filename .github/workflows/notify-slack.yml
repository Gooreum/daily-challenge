name: Notify Slack on study log

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    # 학습 기록 커밋(commitStudyLog가 만드는 "study: ..." 메시지)일 때만 알림.
    # 코드/CI/기타 커밋은 제외한다.
    if: ${{ github.event.head_commit != null && startsWith(github.event.head_commit.message, 'study:') }}
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          MSG: ${{ github.event.head_commit.message }}
          URL: ${{ github.event.head_commit.url }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::error::SLACK_WEBHOOK_URL secret 이 설정되지 않았습니다."
            exit 1
          fi
          # MSG 예: "study: [동시성] 1. async/await 기초 학습 기록 (8문항)"
          text=$(printf '📚 *학습 완료!*\n%s\n👤 %s\n🔗 <%s|기록 보기>' "$MSG" "$ACTOR" "$URL")
          jq -n --arg t "$text" '{text: $t}' \
            | curl -sS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
